name = "goldin-price"
main = "worker.js"
compatibility_date = "2026-11-01"

# هر ۵ دقیقه یک نمونهٔ قیمت در KV ذخیره می‌شود
[triggers]
crons = ["*/5 * * * *"]

# ابتدا بساز: npx wrangler kv namespace create HISTORY
# بعد id چاپ‌شده را جای REPLACE_WITH_KV_ID بگذار
[[kv_namespaces]]
binding = "HISTORY"
id = "REPLACE_WITH_KV_ID"

[vars]
# فقط origin سایت، بدون مسیر. مثال: https://YOUR-USERNAME.github.io
ALLOW_ORIGIN = "https://YOUR-USERNAME.github.io"
